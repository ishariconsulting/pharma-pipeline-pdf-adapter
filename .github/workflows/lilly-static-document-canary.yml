name: Lilly Static Document Canary

on:
  workflow_dispatch:
  push:
    paths:
      - 'lilly_static_document_canary.py'
      - '.github/workflows/lilly-static-document-canary.yml'

permissions:
  contents: read

jobs:
  lilly-static-document-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install canary dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyMuPDF==1.25.5 httpx==0.28.1

      - name: Run read-only Lilly static document canary
        run: python lilly_static_document_canary.py
