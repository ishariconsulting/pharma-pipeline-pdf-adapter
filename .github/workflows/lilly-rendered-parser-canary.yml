name: Lilly Rendered Parser Canary

on:
  push:
    paths:
      - 'lilly_rendered_parser_canary.py'
      - '.github/workflows/lilly-rendered-parser-canary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lilly-rendered-parser-canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install canary dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Run read-only Lilly rendered parser canary
        run: python lilly_rendered_parser_canary.py
