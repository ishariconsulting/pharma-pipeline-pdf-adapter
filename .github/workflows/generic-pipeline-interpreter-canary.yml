name: Generic pipeline interpreter canary

on:
  pull_request:
    paths:
      - "generic_pipeline_interpreter_canary.py"
      - ".github/workflows/generic-pipeline-interpreter-canary.yml"
  workflow_dispatch:

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx==0.28.1

      - name: Run read-only multi-company canary
        run: |
          python generic_pipeline_interpreter_canary.py
